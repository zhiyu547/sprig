name: Bug report / 问题反馈
description: Report a reproducible Sprig issue without private repository data.
body:
  - type: markdown
    attributes:
      value: "请使用合成代码复现。不要上传密钥、业务代码、真实远端地址或含敏感内容的截图。安全漏洞请使用私密报告渠道。"
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: Sprig version, macOS version, Apple Silicon or Intel
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result / 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
